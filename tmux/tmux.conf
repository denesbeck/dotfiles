set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

unbind C-b
set -g prefix C-w
bind C-w send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Window names: default to the current directory, but keep manual renames
# (prefix + , to rename, prefix + A to restore auto-rename)
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g allow-rename off
bind , command-prompt -I "#W" "rename-window -- '%%'"
bind A set-window-option automatic-rename on \; display-message "auto-rename restored"

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
set -g @resurrect-processes '"claude->~/.config/tmux/scripts/claude-resume.sh run" lazygit'
set -g @resurrect-hook-post-save-all '~/.config/tmux/scripts/claude-resume.sh save'
set-hook -g 'client-detached[10]' 'run-shell -b "~/.config/tmux/scripts/tmux-save.sh"'
set-hook -g 'window-unlinked[10]' 'run-shell -b "~/.config/tmux/scripts/tmux-save.sh"'
set-hook -g 'pane-exited[10]' 'run-shell -b "~/.config/tmux/scripts/tmux-save.sh"'
set-hook -g 'after-kill-pane[10]' 'run-shell -b "~/.config/tmux/scripts/tmux-save.sh"'
set-hook -g 'after-new-window[10]' 'run-shell -b "~/.config/tmux/scripts/tmux-save.sh"'
set-hook -g 'after-split-window[10]' 'run-shell -b "~/.config/tmux/scripts/tmux-save.sh"'

set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_directory_text " #{=/-40/…:#{s|$HOME|~|:pane_current_path}}"
set -g @catppuccin_window_status "icon"
set -g @catppuccin_window_current_number_color "#{@thm_maroon}"
set -g @catppuccin_window_number_color "#{@thm_blue}"

if-shell "[ -f ~/.config/tmux/plugins/tmux/catppuccin.tmux ]" \
  "run ~/.config/tmux/plugins/tmux/catppuccin.tmux"

set -g window-status-current-style default

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_directory}"
# Git pill, hidden outside a repo
set -g @git_info "#(~/.config/tmux/scripts/tmux-git.sh '#{pane_current_path}')"
set -ag status-right "#{?#{E:@git_info},#[fg=#{@thm_teal}]#[fg=#{@thm_crust}]#[bg=#{@thm_teal}] #[fg=#{@thm_fg}]#[bg=#{@thm_surface_0}] #{E:@git_info}#[fg=#{@thm_surface_0}] ,}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'

# Window tabs: must come after tpm, which re-runs catppuccin and overwrites them
set -g window-status-separator " "
set -g @card_bg "#{?window_active,#{@thm_surface_1},#{@thm_surface_0}}"
set -g @card_num "#{?window_active,#{@thm_maroon},#{@thm_blue}}"
set -g @card_name "#[fg=#{@thm_fg}]"
set -g @card_state_color "#{?#{==:#{@claude_status},waiting},#{@thm_red},#{?#{==:#{@claude_status},working},#{@thm_yellow},#{?#{==:#{@claude_status},done},#{@thm_green},#{@thm_overlay_0}}}}"
set -g @card_state_icon "#{?#{==:#{@claude_status},waiting},,#{?#{==:#{@claude_status},working},,#{?#{==:#{@claude_status},done},,}}}"
set -g @card "#[fg=#{E:@card_num}]#[bg=default]#[bg=#{E:@card_num}]#[fg=#{@thm_crust}]#I #[bg=#{E:@card_bg}]#{E:@card_name} #W #[fg=#{E:@card_state_color}]#{E:@card_state_icon}#[fg=#{E:@card_bg}]#[bg=default]#[default]"
set -g window-status-format "#{E:@card}"
set -g window-status-current-format "#{E:@card}"
